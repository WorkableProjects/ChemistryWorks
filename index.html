<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChemistryWorks</title>
  <meta name="description" content="ChemistryWorks — a fluid, auto-graded chemistry testing platform." />
  <meta name="theme-color" content="#00224F" />
  <script>
    // Apply the saved theme before first paint (js/lib/theme.js takes over once the app loads).
    (function () {
      try {
        var d = document.documentElement, ls = window.localStorage;
        var t = JSON.parse(ls.getItem('cw:theme') || '"system"');
        var admin = /[?&]admin=true/.test(location.search);
        var a = JSON.parse(ls.getItem(admin ? 'cw:accent:admin' : 'cw:accent:student') || 'null') || 'navy';
        d.dataset.theme = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        d.dataset.accent = a;
        d.dataset.role = admin ? 'admin' : 'student';
      } catch (e) { /* storage blocked: defaults apply */ }
    })();
  </script>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/brand/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/runner.css" />
  <link rel="stylesheet" href="css/results.css" />
  <link rel="stylesheet" href="css/landing.css?v=4.1.1" />
  <link rel="stylesheet" href="css/status.css" />
  <link rel="stylesheet" href="css/export.css" />
  <link rel="stylesheet" href="css/qtypes.css" />
  <link rel="stylesheet" href="css/qtypes-s08.css" />
  <link rel="stylesheet" href="css/qtypes-s09.css" />
  <link rel="stylesheet" href="css/qtypes-s10.css" />
  <link rel="stylesheet" href="css/qt-ionicformula.css" />
  <link rel="stylesheet" href="css/qt-isotopemass.css" />

  <!-- KaTeX + mhchem are loaded on demand by js/ui.js (loadKatex) when content contains math. -->
  <!-- Google Identity Services -->
  <script async defer src="https://accounts.google.com/gsi/client"></script>

  <script type="module" src="js/app.js?v=4.1.1"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <!-- Netlify Forms: detected at deploy time; populated and posted by js/lib/submit.js -->
  <form name="chemistryworks-submissions" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="chemistryworks-submissions" />
    <input type="hidden" name="bot-field" />
    <input type="hidden" name="submission_id" />
    <input type="hidden" name="student_name" />
    <input type="hidden" name="student_email" />
    <input type="hidden" name="test_code" />
    <input type="hidden" name="test_title" />
    <input type="hidden" name="score_achieved" />
    <input type="hidden" name="score_total" />
    <input type="hidden" name="percentage" />
    <input type="hidden" name="duration_seconds" />
    <input type="hidden" name="needs_grading" />
    <input type="hidden" name="single_submission" />
    <input type="hidden" name="responses_json" />
    <input type="hidden" name="flags_json" />
    <input type="hidden" name="submitted_at" />
  </form>

  <div id="app" class="app" aria-live="polite">
    <!-- Boot loader: same markup as flaskSvg() in js/ui.js (keep in sync). -->
    <div class="boot cw-loader" role="status">
      <span class="cw-loader__art"><svg class="cw-flask" width="96" height="96" viewBox="-6 -22 112 130" aria-hidden="true" focusable="false">
        <defs><clipPath id="cwl0"><path d="M42.5 47 L19 91 Q15.5 99.5 25 99.5 H75 Q84.5 99.5 81 91 L57.5 47 Z"/></clipPath></defs>
        <g clip-path="url(#cwl0)"><g class="cw-flask__liquid"><path class="cw-flask__wave cw-flask__wave--back" d="M-100 70 q12.5 -6 25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 V110 H-100 Z"/><path class="cw-flask__wave" d="M-100 74 q12.5 6 25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 V110 H-100 Z"/></g>
        <circle class="cw-flask__bubble" cx="40" cy="96" r="4"/><circle class="cw-flask__bubble" cx="55" cy="96" r="3"/><circle class="cw-flask__bubble" cx="64" cy="96" r="2.5"/></g>
        <path class="cw-flask__glass" d="M40 12 V45 L15 90 Q9 104 25 104 H75 Q91 104 85 90 L60 45 V12"/><path class="cw-flask__glass" d="M33 12 H67"/>
        <g class="cw-flask__molecule"><path class="cw-flask__bond" d="M50 -10 L76 10"/><circle class="cw-flask__atom" cx="47" cy="-12" r="9"/><circle class="cw-flask__atom" cx="79" cy="12" r="6"/></g>
      </svg></span>
      <p class="cw-loader__label">Loading ChemistryWorks…</p>
    </div>
  </div>

  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript>ChemistryWorks needs JavaScript enabled to run tests.</noscript>
</body>
</html>
