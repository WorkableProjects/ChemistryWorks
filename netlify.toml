[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/test"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/data/tests/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
