[build]
  publish = "."
  command = ""
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)README' ':(exclude)README.*' ':(exclude)docs/**' ':(exclude)data/tests/**'"

[[redirects]]
  from = "/test"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/data/tests/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
